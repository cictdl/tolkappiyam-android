plugins {
    id "com.android.application"
}

// Release signing is driven entirely by environment variables so that no secret
// ever lives in the repository. On CI these come from GitHub Actions secrets;
// locally you can export them before running gradle.
def storeFilePath = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
def hasSigningConfig = file(storeFilePath).exists() && System.getenv("STORE_PASSWORD") != null

android {
    namespace "com.cict.tolkappiyam"
    compileSdk 35

    defaultConfig {
        applicationId "com.cict.tolkappiyam"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(storeFilePath)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("STORE_PASSWORD")
                // v1 is unnecessary at minSdk 24; v3 is what lets the signing key be
                // rotated later without breaking updates, so opt in explicitly.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasSigningConfig ? signingConfigs.release : null
            // The app is a WebView shell: there is no Java worth shrinking, and
            // shrinking cannot touch the assets that dominate the download size.
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Transitive deps disagree about the Kotlin stdlib: one pulls kotlin-stdlib 1.8.22,
    // another the legacy kotlin-stdlib-jdk7/jdk8 1.6.21. Those JDK artifacts were folded
    // into the main stdlib in Kotlin 1.8, so mixing versions duplicates classes and the
    // dex step fails. The BOM pins them all to one version.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
}

// Fail the release build loudly rather than silently shipping an unsigned APK.
tasks.matching { it.name in ["assembleRelease", "bundleRelease"] }.configureEach {
    doFirst {
        if (!hasSigningConfig) {
            throw new GradleException(
                "Release signing is not configured. Set KEYSTORE_PATH (or place " +
                "release.keystore in app/) plus STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.")
        }
    }
}
